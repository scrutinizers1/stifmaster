<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<meta name="robots" content="noindex,nofollow">
<title>Light Bearers — Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f2a44'/%3E%3Ccircle cx='32' cy='26' r='8' fill='%23ffd166'/%3E%3Cpath d='M16 46c2.6-7 8.6-11 16-11s13.4 4 16 11z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --bg2:#eaeef5; --card:#fff; --line:#e2e8f0; --line2:#d3dbe6;
  --ink:#0f2233; --muted:#64748b;
  --navy:#0f2a44; --navy2:#173a5e; --primary:#159a76; --primary-d:#0f7d5f;
  --sky:#3aa7e0; --sun:#ffb703; --coral:#ff6b6b;
  --grad:linear-gradient(135deg,#159a76,#3aa7e0);
  --grad2:linear-gradient(135deg,#ffb703,#ff8a3d);
  --r:16px; --shadow:0 10px 30px rgba(15,34,51,.08); --shadow-s:0 3px 12px rgba(15,34,51,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
h1,h2,h3,h4,.logo{font-family:Nunito,Inter,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid rgba(21,154,118,.45);outline-offset:2px;border-radius:10px}

header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:60;box-shadow:0 6px 20px rgba(15,42,68,.25)}
.bar{max-width:1280px;margin:auto;display:flex;align-items:center;gap:14px;padding:13px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center}
.logo small{display:block;font-family:Inter;font-size:10.5px;font-weight:600;color:#9fb4cc;letter-spacing:.02em}
.spacer{margin-left:auto}
.badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:#cfe0f2}

main{max-width:1280px;margin:auto;padding:26px 20px 90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.2s;border:1px solid transparent;white-space:nowrap}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(21,154,118,.28)}
.btn.p:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--card);border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary-d)}
.btn.navy{background:var(--navy);color:#fff}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.btn.danger{background:#fff0f0;color:#c0392b;border-color:#f6cfcf}
.btn.danger:hover{background:#ffe3e3}

.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:999px;background:rgba(15,42,68,.08);color:var(--navy2);border:1px solid rgba(15,42,68,.12)}
.pill b{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s)}

.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;border:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap;width:max-content;max-width:100%;box-shadow:var(--shadow-s)}
.tabs button{padding:9px 17px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff}

/* search hero */
.searchbox{background:linear-gradient(135deg,#0f2a44,#173a5e);border-radius:20px;padding:24px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(15,42,68,.25)}
.searchbox::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.searchbox h2{font-size:20px;position:relative;z-index:2}
.searchbox p{color:#a9c0d8;font-size:13.5px;margin:4px 0 16px;position:relative;z-index:2}
.sfield{position:relative;z-index:2}
.sfield input{width:100%;padding:15px 18px 15px 48px;border-radius:14px;border:0;font:inherit;font-size:16px;outline:none;background:rgba(255,255,255,.96);color:var(--ink)}
.sfield svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.sfield .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--bg2);display:none;place-items:center;color:var(--muted);font-size:15px}
.sfield input:not(:placeholder-shown)~.clr{display:grid}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.stat{padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.stat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg2);margin-bottom:10px}
.stat b{font-family:Nunito;font-size:26px;font-weight:900;display:block}
.stat span{color:var(--muted);font-size:13px;font-weight:600}

.tag{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag.pending{background:#fff5e0;color:#a86a00}
.tag.approved{background:#e6f7ef;color:var(--primary-d)}
.tag.rejected{background:#fff0f0;color:#c0392b}
.tag.paid{background:#e6f7ef;color:var(--primary-d)}
.tag.partial{background:#fff5e0;color:#a86a00}
.tag.unpaid{background:#fff0f0;color:#c0392b}
.tag.plan{background:#e8f2ff;color:#1d6fb8}

/* student rows */
.stu-list{display:flex;flex-direction:column;gap:12px}
.stu-row{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s);cursor:pointer;transition:.18s;flex-wrap:wrap}
.stu-row:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.avatar{width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900;font-family:Nunito;font-size:18px;flex:0 0 auto}
.stu-row .info{flex:1;min-width:180px}
.stu-row .info b{font-size:16px;font-family:Nunito}
.stu-row .info span{display:block;color:var(--muted);font-size:13px}
.stu-no-chip{font-family:Nunito;font-weight:900;font-size:15px;letter-spacing:.03em;background:var(--navy);color:#fff;padding:8px 14px;border-radius:11px;white-space:nowrap}
.stu-no-chip small{display:block;font-family:Inter;font-size:9.5px;font-weight:700;letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.stu-row .bal{text-align:right;min-width:96px}
.stu-row .bal b{font-family:Nunito;font-size:16px;font-weight:900;display:block}
.stu-row .bal span{font-size:11.5px;color:var(--muted);font-weight:600}

.app-card{padding:22px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s);margin-bottom:18px}
.app-card .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.app-card .hd h3{font-size:17px}
.app-card .hd .when{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kv div{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.kv div span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kv div b{font-size:14px;font-weight:600;word-break:break-word}
.doc-mini{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.doc-mini a,.doc-mini span.miss{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:9px 13px;border-radius:11px;background:var(--bg2);border:1px solid var(--line)}
.doc-mini span.miss{opacity:.6;font-weight:600}
.doc-mini a:hover{border-color:var(--primary);color:var(--primary-d)}
.doc-mini img{width:34px;height:34px;object-fit:cover;border-radius:7px}
.app-acts{display:flex;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line2);padding-top:16px;align-items:center}
.review-note{width:100%;margin-bottom:12px;padding:11px 13px;border-radius:11px;border:1px solid var(--line2);font:inherit;font-size:14px;background:#fff}

.inv{padding:18px 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s);margin-bottom:14px}
.inv-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.inv-top .who2{flex:1;min-width:200px}
.inv-top h3{font-size:16px}
.inv-top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.inv-grid{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.inv-grid div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.inv-grid div b{font-family:Nunito;font-size:17px;font-weight:900}
.pay-log{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}

.form-card{padding:24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 .full{grid-column:1/-1}
label.f{display:block;font-size:13px;font-weight:700;color:#3f5165}
label.f input,label.f select{display:block;width:100%;margin-top:7px;padding:12px 14px;border-radius:11px;border:1px solid var(--line2);background:#fff;font:inherit;font-size:14.5px;color:var(--ink);outline:none;transition:.18s}
label.f input:focus,label.f select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(21,154,118,.12)}
label.f .hint{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:5px}

.modal{position:fixed;inset:0;z-index:200;background:rgba(15,34,51,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.modal.open{display:flex}
.sheet{width:min(680px,100%);background:var(--card);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(15,34,51,.4);margin:auto;animation:pop .22s ease}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.sheet .close{float:right;width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:18px;margin:-6px -6px 0 0}
.sheet h3{font-size:20px;margin-bottom:2px}
.sheet .mut{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.note{font-size:12.5px;color:var(--muted);background:var(--bg2);padding:11px 13px;border-radius:11px;margin-top:14px;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:46px 20px}
.empty .ico{font-size:38px;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px;font-family:Nunito}
.center{text-align:center}
.row-b{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mt{margin-top:20px}
.hr{height:1px;background:var(--line);margin:22px 0;border:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0f2a44,#173a5e)}
.gate .box{width:min(420px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate .mark{width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;margin-bottom:16px}
.gate h1{font-size:24px}
.gate p{color:var(--muted);font-size:14px;margin:6px 0 22px}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);z-index:300;background:var(--navy);color:#fff;padding:13px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast.ok{background:#0f7d5f}
.toast.err{background:#c0392b}

@media (max-width:700px){
  .grid2{grid-template-columns:1fr}
  .stu-row .bal{text-align:left}
  main{padding:18px 14px 80px}
}
</style>
</head>
<body>

<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Light Bearers Child Care Centre — ADMIN console (admin.html)
   Approve parents, issue student numbers, search learners by name,
   track fees. Shares the same browser storage as index.html.
   ===================================================================== */

const CONFIG = {
  centre: 'Light Bearers Child Care Centre',
  googleClientId: '', yocoPublicKey: '',
  adminPassword: 'lightbearers', planDays: 60, registrationFee: 350
};
const PROGRAMS = {
  baby:      { label:'Baby Care',            age:'3 – 18 months',       fee:2200, emoji:'🍼' },
  toddler:   { label:'Toddler Playgroup',    age:'18 months – 3 years', fee:1800, emoji:'🧸' },
  preschool: { label:'Pre-School',           age:'3 – 5 years',         fee:1500, emoji:'🎨' },
  aftercare: { label:'Aftercare & Homework', age:'6 – 12 years',        fee:950,  emoji:'📚' }
};
const KEY = 'lightbearers_v1';

function normalizeDB(d){
  d = (d && typeof d === 'object') ? d : {};
  d.users = d.users || {}; d.apps = d.apps || []; d.docs = d.docs || {};
  d.invoices = d.invoices || []; d.settings = d.settings || {};
  d.messages = d.messages || []; d.outbox = d.outbox || []; d.read = d.read || {};
  return d;
}
function loadDB(){ try{ return normalizeDB(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return normalizeDB({}); } }
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Storage full — export and reset.','err'); } }
let DB = loadDB();

let ADMIN = sessionStorage.getItem('lb_admin') === '1';
let tab = 'students';
let query = '';
let statusFilter = 'all';

/* ---------------- helpers ---------------- */
function setting(k){ const v = DB.settings[k]; return (v !== undefined && v !== '') ? v : CONFIG[k]; }
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function R(n){ return 'R' + Number(n||0).toLocaleString('en-ZA'); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}); }
function fmtPeriod(p){ const [y,m]=p.split('-'); return new Date(Number(y),Number(m)-1,1).toLocaleDateString('en-ZA',{month:'long',year:'numeric'}); }
function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.className = 'toast show ' + (kind||'');
  t.textContent = (kind==='ok'?'✅ ':kind==='err'?'⚠️ ':'ℹ️ ') + msg;
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.className='toast '+(kind||''); },3600);
}
function openModal(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

/* ---------------- student numbers ---------------- */
function allStudents(){
  const out = [];
  DB.apps.forEach(a => (a.children||[]).forEach(c => out.push({
    child:c, app:a, email:a.email, parent:a.parentName,
    status:a.status, studentNo:c.studentNo || null
  })));
  return out;
}
function nextStudentNo(){
  DB.settings.seq = Number(DB.settings.seq) || 1000;
  const y = String(new Date().getFullYear()).slice(-2);
  const used = new Set(allStudents().map(s => s.studentNo).filter(Boolean));
  let no;
  do { DB.settings.seq++; no = 'LB' + y + '-' + String(DB.settings.seq).padStart(4,'0'); } while(used.has(no));
  return no;
}
function issueNumbers(app){
  let issued = [];
  (app.children||[]).forEach(ch => {
    if(!ch.studentNo){ ch.studentNo = nextStudentNo(); issued.push(ch.name + ' → ' + ch.studentNo); }
  });
  if(issued.length) saveDB();
  return issued;
}
function childBalance(childId){
  return DB.invoices.filter(i => i.childId === childId).reduce((s,i)=> s + (i.amount - i.paid), 0);
}
function ensureInvoices(app){
  if(app.status !== 'approved') return;
  const period = new Date().toISOString().slice(0,7);
  let added = false;
  app.children.forEach(ch => {
    if(!DB.invoices.some(i => i.childId === ch.id && i.period === period)){
      const prog = PROGRAMS[ch.program] || PROGRAMS.preschool;
      DB.invoices.push({ id:uid(), email:app.email, childId:ch.id, childName:ch.name, program:ch.program, period,
        amount:prog.fee, paid:0, status:'unpaid', plan:false, dueDate:null, payments:[], createdAt:new Date().toISOString() });
      added = true;
    }
  });
  if(added) saveDB();
}

/* ---------------- announcements + email ---------------- */
const MSG_CATS = {
  general:{ label:'General', ico:'📢' }, trip:{ label:'Trip / outing', ico:'🚌' },
  food:{ label:'Food / menu', ico:'🍎' }, party:{ label:'Party', ico:'🎉' },
  farewell:{ label:'Farewell', ico:'👋' }
};
async function sendEmail(o){
  const rec = { id:uid(), to:o.to, subject:o.subject, body:o.body, at:new Date().toISOString(), status:'demo', provider:'demo' };
  const svc = setting('emailjsService'), tpl = setting('emailjsTemplate'), pk = setting('emailjsPublicKey');
  if(svc && tpl && pk){
    try{
      const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ service_id:svc, template_id:tpl, user_id:pk, template_params:{ to_email:o.to, subject:o.subject, message:o.body, centre:CONFIG.centre } })
      });
      rec.status = res.ok ? 'sent' : 'failed'; rec.provider = 'emailjs';
    }catch(e){ rec.status = 'failed'; rec.provider = 'emailjs'; }
  }
  DB.outbox.unshift(rec); saveDB();
  return rec;
}
function emailApproved(app){
  const lines = app.children.map(c => '• ' + c.name + ' — student number ' + (c.studentNo || '')).join('\n');
  return sendEmail({
    to: app.email,
    subject: 'Enrolment approved — welcome to ' + CONFIG.centre,
    body: 'Hi ' + app.parentName + ',\n\nGreat news! Your enrolment at ' + CONFIG.centre + ' has been APPROVED.\n\n' + lines +
      '\n\nYour parent portal is now active. Log in with your student number to pay fees and read centre notices (trips, menu changes, parties and more).\n\nKind regards,\n' + CONFIG.centre
  });
}
function emailRejected(app, note){
  return sendEmail({
    to: app.email,
    subject: 'Update on your enrolment application',
    body: 'Hi ' + app.parentName + ',\n\nThank you for applying to ' + CONFIG.centre + '. Unfortunately we could not approve your application at this time.\n\n' +
      (note ? 'Reason: ' + note + '\n\n' : '') + 'You are welcome to correct your details and apply again, or contact the office.\n\nKind regards,\n' + CONFIG.centre
  });
}
function refreshTarget(){
  const aud = document.getElementById('audience'), t = document.getElementById('target'), wrap = document.getElementById('targetWrap');
  if(!aud || !t || !wrap) return;
  if(aud.value === 'all'){ wrap.style.display = 'none'; t.innerHTML = ''; return; }
  wrap.style.display = '';
  if(aud.value === 'programme'){
    t.innerHTML = Object.entries(PROGRAMS).map(([k,p])=>`<option value="${k}">${esc(p.label)} — ${esc(p.age)}</option>`).join('');
  }else{
    const st = allStudents().filter(s=>s.status==='approved');
    t.innerHTML = st.length ? st.map(s=>`<option value="${esc(s.child.id)}">${esc(s.child.name)}${s.studentNo?' ('+esc(s.studentNo)+')':''}</option>`).join('') : `<option value="">No approved learners yet</option>`;
  }
}

/* =================== VIEWS =================== */
function render(){
  if(!ADMIN){ renderGate(); return; }
  document.getElementById('app').innerHTML = shell();
  if(tab === 'messages') refreshTarget();
}
function renderGate(){
  document.getElementById('app').innerHTML = `
  <div class="gate">
    <div class="box">
      <div class="mark"><svg viewBox="0 0 24 24" width="30" height="30" fill="none"><circle cx="12" cy="9" r="4" fill="#ffd166"/><path d="M4 20c1.6-4.2 4.7-6.5 8-6.5s6.4 2.3 8 6.5z" fill="#fff"/></svg></div>
      <h1>Admin console</h1>

function tabsHTML(){
  const counts = { pending:0, approved:0, rejected:0 };
  DB.apps.forEach(a => counts[a.status] !== undefined && counts[a.status]++);
  const items = [['students','🎓 Students'],['applications','📥 Applications' + (counts.pending ? ' · '+counts.pending : '')],['messages','📣 Messages'],['payments','💳 Payments'],['outbox','📤 Emails'],['settings','⚙️ Settings']];
  return `<div class="tabs">${items.map(([k,l])=>`<button class="${tab===k?'on':''}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</div>`;
}

/* ---------- students ---------- */
function viewStudents(){
  const students = allStudents();
  const q = query.trim().toLowerCase();
  const filtered = students.filter(s => {
    if(statusFilter !== 'all' && s.status !== statusFilter) return false;
    if(!q) return true;
    return (s.child.name||'').toLowerCase().includes(q)
        || (s.studentNo||'').toLowerCase().includes(q)
        || (s.parent||'').toLowerCase().includes(q)
        || (s.email||'').toLowerCase().includes(q);
  });
  const totalOut = students.reduce((sum,s)=> sum + childBalance(s.child.id), 0);
  const approved = students.filter(s=>s.status==='approved').length;

  return `
  ${tabsHTML()}
  <div class="searchbox">
    <h2>Find a learner</h2>
    <p>Type a child's name — or a student number — to pull up their record instantly.</p>
    <div class="sfield">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Search name, student number, parent or email…" value="${esc(query)}" autocomplete="off">
      <button class="clr" data-action="clear-q" title="Clear">✕</button>
    </div>
  </div>

  <div class="grid3" style="margin-bottom:20px">
    <div class="stat"><div class="ico">🎓</div><b>${students.length}</b><span>Learners on file</span></div>
    <div class="stat"><div class="ico">✅</div><b>${approved}</b><span>Approved &amp; enrolled</span></div>
    <div class="stat"><div class="ico">💰</div><b>${R(totalOut)}</b><span>Outstanding fees</span></div>
  </div>

  <div class="row-b" style="margin-bottom:16px">
    ${[['all','All'],['approved','Approved'],['pending','Pending'],['rejected','Rejected']].map(([k,l])=>
      `<button class="btn ${statusFilter===k?'navy':'ghost'} sm" data-action="filter" data-f="${k}">${l}</button>`).join('')}
  </div>

  ${students.length === 0
    ? `<div class="empty"><div class="ico">🗂️</div><b>No learners yet</b>Approve an application and student numbers will appear here.<div class="mt"><button class="btn ghost sm" data-action="seed">Add a sample application</button></div></div>`
    : filtered.length === 0
      ? `<div class="empty"><div class="ico">🔍</div><b>No match for “${esc(query)}”</b>Try a different name or the student number.</div>`
      : `<div class="stu-list">${filtered.map(s => studentRow(s)).join('')}</div>`}
  `;
}
function studentRow(s){
  const bal = childBalance(s.child.id);
  const prog = PROGRAMS[s.child.program];
  return `
  <div class="stu-row" data-action="open-student" data-id="${esc(s.child.id)}">
    <div class="avatar">${esc(initials(s.child.name))}</div>
    <div class="info">
      <b>${esc(s.child.name)}</b>
      <span>${esc(prog?prog.label:'')} · Parent: ${esc(s.parent)}</span>
      <span style="margin-top:4px"><span class="tag ${s.status}">${s.status}</span></span>
    </div>
    <div class="stu-no-chip"><small>Student no.</small>${esc(s.studentNo || 'Not issued')}</div>
    <div class="bal"><b style="color:${bal>0?'#c0392b':'var(--primary-d)'}">${R(bal)}</b><span>${bal>0?'outstanding':'paid up'}</span></div>
  </div>`;
}

/* ---------- applications ---------- */
function viewApplications(){
  const apps = DB.apps.slice().reverse();
  return `
  ${tabsHTML()}
  <div class="row-b" style="justify-content:space-between;margin-bottom:16px">
    <div><span class="pill"><b></b> Applications</span><h2 style="margin-top:10px;font-size:22px">Approve parents</h2></div>
    <button class="btn ghost sm" data-action="seed">➕ Add sample application</button>
  </div>
  ${apps.length === 0
    ? `<div class="empty"><div class="ico">📥</div><b>No applications yet</b>Applications submitted from index.html appear here for approval.</div>`
    : apps.map(a => appCard(a)).join('')}`;
}
function appCard(a){
  const docs = DB.docs[a.email] || {};
  const docLink = (kind, label) => {
    const d = docs[kind];
    if(!d) return `<span class="miss">${esc(label)}: not uploaded</span>`;
    return d.type === 'application/pdf'
      ? `<a href="${d.dataUrl}" target="_blank" rel="noopener">📄 ${esc(label)} (PDF)</a>`
      : `<a href="${d.dataUrl}" target="_blank" rel="noopener"><img src="${d.dataUrl}" alt=""> ${esc(label)}</a>`;
  };
  return `
  <div class="app-card">
    <div class="hd">
      <h3>${esc(a.parentName)}</h3>
      <span class="tag ${a.status}">${a.status}</span>
      <span class="when">${esc(a.email)} · submitted ${esc(fmtDate(a.submittedAt))}</span>
    </div>
    <div class="kv">
      <div><span>Phone</span><b>${esc(a.phone)}${a.altPhone?' / '+esc(a.altPhone):''}</b></div>
      <div><span>Relationship</span><b>${esc(a.relation||'—')}</b></div>
      <div><span>Address</span><b>${esc([a.address.line1,a.address.suburb,a.address.city,a.address.province,a.address.postal].filter(Boolean).join(', '))}</b></div>
      <div><span>Emergency</span><b>${esc(a.emergency.name)} · ${esc(a.emergency.phone)}</b></div>
      <div><span>Children</span><b>${a.children.map(c=>esc(c.name)+' ('+esc(PROGRAMS[c.program]?PROGRAMS[c.program].label:c.program)+')'+(c.studentNo?' · '+esc(c.studentNo):'')).join('<br>')}</b></div>
    </div>
    <div class="doc-mini">${docLink('id','Parent ID')}${docLink('address','Proof of address')}</div>
    ${a.status === 'pending' ? `
      <input class="review-note" data-note="${esc(a.id)}" placeholder="Optional reason (shown to the parent if dismissed)">
      <div class="app-acts">
        <button class="btn p sm" data-action="approve" data-id="${esc(a.id)}">✅ Approve &amp; issue student no.</button>
        <button class="btn danger sm" data-action="reject" data-id="${esc(a.id)}">🚫 Dismiss</button>
      </div>`
    : `<div class="app-acts">
        <span style="font-size:13px;color:var(--muted)">${a.reviewedAt?'Reviewed '+esc(fmtDate(a.reviewedAt)):''}${a.reviewNote?' · Reason: '+esc(a.reviewNote):''}</span>
        ${a.status==='approved' ? `<button class="btn ghost sm" data-action="issue-missing" data-id="${esc(a.id)}">Issue any missing student numbers</button>
          <input class="review-note" style="margin:0;flex:1;min-width:180px" data-note="${esc(a.id)}" placeholder="Reason (shown to the parent if dismissed)">
          <button class="btn danger sm" data-action="reject" data-id="${esc(a.id)}">🚫 Dismiss student</button>` : ''}
      </div>
      ${a.status === 'rejected' ? (a.appeal ? `
        <div style="border-top:1px dashed var(--line2);padding-top:14px;margin-top:8px">
          <div class="kv" style="margin-bottom:10px"><div style="grid-column:1/-1"><span>Appeal · submitted ${esc(fmtDate(a.appeal.at))}</span><b style="white-space:pre-wrap">${esc(a.appeal.text)}</b></div></div>
          ${a.appealStatus==='pending' ? `<div class="app-acts" style="border:0;padding-top:0">
            <button class="btn p sm" data-action="undismiss" data-id="${esc(a.id)}">🔓 Undismiss (approve)</button>
            <button class="btn danger sm" data-action="uphold" data-id="${esc(a.id)}">Uphold dismissal</button>
          </div>` : `<span class="tag ${a.appealStatus==='accepted'?'approved':'rejected'}">Appeal ${esc(a.appealStatus)}</span>`}
        </div>`
      : `<div class="app-acts" style="border-top:1px dashed var(--line2);padding-top:14px">
          <span style="font-size:13px;color:var(--muted);flex:1">🔒 Portal locked — no appeal submitted yet.</span>
          <button class="btn p sm" data-action="undismiss" data-id="${esc(a.id)}">🔓 Undismiss</button>
        </div>`) : ''}`}
  </div>`;
}

/* ---------- payments ---------- */
function viewPayments(){
  const invs = DB.invoices.slice().sort((a,b)=> a.period < b.period ? 1 : -1);
  const collected = invs.reduce((s,i)=> s+i.paid, 0);
  const outstanding = invs.reduce((s,i)=> s+(i.amount-i.paid), 0);
  const plans = invs.filter(i=>i.plan && i.dueDate);
  return `
  ${tabsHTML()}
  <span class="pill"><b></b> Payments</span>
  <h2 style="margin:10px 0 18px;font-size:22px">Fees &amp; payment plans</h2>
  <div class="grid3" style="margin-bottom:20px">
    <div class="stat"><div class="ico">📥</div><b>${R(collected)}</b><span>Total collected</span></div>
    <div class="stat"><div class="ico">📤</div><b>${R(outstanding)}</b><span>Outstanding</span></div>
    <div class="stat"><div class="ico">⏳</div><b>${plans.length}</b><span>Active ${setting('planDays')}-day plans</span></div>
  </div>
  ${invs.length === 0
    ? `<div class="empty"><div class="ico">💳</div><b>No invoices yet</b>Invoices are created automatically when you approve an application.</div>`
    : invs.map(inv => {
      const u = DB.users[inv.email] || {};
      return `<div class="inv">
        <div class="inv-top">
          <div class="who2"><h3>${esc(inv.childName)}</h3><div class="sub">${esc(u.name||inv.email)} · ${esc(fmtPeriod(inv.period))}</div></div>
          <span class="tag ${inv.status}">${inv.status}</span>
          ${inv.plan?`<span class="tag plan">plan${inv.dueDate?' · due '+esc(fmtDate(inv.dueDate)):''}</span>`:''}
        </div>
        <div class="inv-grid">
          <div><span>Total</span><b>${R(inv.amount)}</b></div>
          <div><span>Paid</span><b>${R(inv.paid)}</b></div>
          <div><span>Balance</span><b>${R(inv.amount-inv.paid)}</b></div>
        </div>
        ${inv.payments && inv.payments.length ? `<div class="pay-log">${inv.payments.map(p=>`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 0"><span>${esc(fmtDate(p.at))} · ${esc(p.method)} · <span class="mono">${esc(p.ref)}</span></span><b style="color:var(--ink)">${R(p.amount)}</b></div>`).join('')}</div>`:''}
      </div>`;
    }).join('')}`;
}

    ${invs.length ? invs.map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;font-size:13.5px">
        <span>${esc(fmtPeriod(i.period))} · ${esc(PROGRAMS[i.program]?PROGRAMS[i.program].label:'')}</span>
        <span><span class="tag ${i.status}">${i.status}</span></span>
        <b>${R(i.amount-i.paid)} due</b>
      </div>`).join('') : `<div class="note">No invoices yet.</div>`}

    <div class="row-b mt">
      ${!c.studentNo ? `<button class="btn p sm" data-action="issue-one" data-id="${esc(c.id)}">Issue student number</button>` : ''}
      <button class="btn ghost sm" data-action="print-student" data-id="${esc(c.id)}">🖨️ Print record</button>
    </div>
  `);
}

/* =================== events =================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  switch(el.dataset.action){
    case 'tab': tab = el.dataset.tab; render(); break;
    case 'filter': statusFilter = el.dataset.f; render(); break;
    case 'clear-q': query = ''; render(); focusSearch(); break;
    case 'open-student': openStudent(el.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'lock': ADMIN = false; sessionStorage.removeItem('lb_admin'); toast('Locked.'); render(); break;
    case 'approve': approveApp(el.dataset.id); break;
    case 'reject': rejectApp(el.dataset.id); break;
    case 'reinstate': reinstateApp(el.dataset.id); break;
    case 'undismiss': reinstateApp(el.dataset.id); break;
    case 'uphold': upholdApp(el.dataset.id); break;
    case 'del-msg': DB.messages = DB.messages.filter(m=>m.id!==el.dataset.id); saveDB(); toast('Announcement deleted.'); render(); break;
    case 'seed-msgs': seedMsgs(); break;
    case 'issue-missing': {
      const a = DB.apps.find(x=>x.id===el.dataset.id); if(!a) break;
      const issued = issueNumbers(a); ensureInvoices(a);
      toast(issued.length ? 'Issued: ' + issued.join(', ') : 'All numbers already issued.', 'ok'); render();
      break;
    }
    case 'issue-one': {
      const s = allStudents().find(x=>x.child.id===el.dataset.id); if(!s) break;
      s.child.studentNo = nextStudentNo(); saveDB();
      toast('Student number ' + s.child.studentNo + ' issued.', 'ok'); openStudent(s.child.id); render();
      break;
    }
    case 'print-student': window.print(); break;
    case 'seed': seed(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset':
      if(confirm('Erase ALL demo data (accounts, applications, documents, invoices, student numbers)? This cannot be undone.')){
        localStorage.removeItem(KEY); localStorage.removeItem('lightbearers_session');
        DB = { users:{}, apps:[], docs:{}, invoices:[], settings:{} };
        toast('All demo data reset.'); render();
      }
      break;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ query = e.target.value; softRenderStudents(); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'audience') refreshTarget();
  if(e.target.id === 'importFile' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!data || typeof data !== 'object') throw 0;
        DB = Object.assign({ users:{}, apps:[], docs:{}, invoices:[], settings:{} }, data);
        saveDB(); toast('Data imported.','ok'); render();
      }catch(err){ toast('That file is not valid Light Bearers data.','err'); }
    };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('submit', e => {
  const f = e.target; const kind = f.dataset.form; if(!kind) return; e.preventDefault();
  if(kind === 'unlock'){
    if(f.pw.value === setting('adminPassword')){ ADMIN = true; sessionStorage.setItem('lb_admin','1'); toast('Welcome back.','ok'); render(); }
    else toast('Wrong password.','err');
    return;
  }
  if(kind === 'message'){
    const aud = f.audience.value;
    const target = aud === 'all' ? null : (f.target ? f.target.value : null);
    if(aud !== 'all' && !target) return toast('Choose a target first.','err');
    DB.messages.unshift({ id:uid(), title:f.title.value.trim(), body:f.body.value.trim(), category:f.category.value,
      audience:aud, target, important:f.important.checked, at:new Date().toISOString(), author:'Front office' });
    saveDB(); toast('Announcement published — parents can see it now.','ok'); render();
    return;
  }
  if(kind === 'settings'){
    DB.settings.registrationFee = Number(f.registrationFee.value) || 0;
    DB.settings.planDays = Math.max(1, Number(f.planDays.value) || 60);
    DB.settings.googleClientId = f.googleClientId.value.trim();
    DB.settings.yocoPublicKey = f.yocoPublicKey.value.trim();
    DB.settings.emailjsService = f.emailjsService.value.trim();
    DB.settings.emailjsTemplate = f.emailjsTemplate.value.trim();
    DB.settings.emailjsPublicKey = f.emailjsPublicKey.value.trim();
    DB.settings.adminPassword = f.adminPassword.value || CONFIG.adminPassword;
    saveDB(); toast('Settings saved.','ok');
    return;
  }
});

/* keep the search box focused + preserve caret while filtering */
function softRenderStudents(){
  const active = document.activeElement && document.activeElement.id === 'q';
  const pos = active ? document.activeElement.selectionStart : null;
  render();
  if(active) focusSearch(pos);
}
function focusSearch(pos){
  const q = document.getElementById('q');
  if(!q) return;
  q.focus();
  if(pos != null){ try{ q.setSelectionRange(pos, pos); }catch(e){} }
}

/* ---------- actions ---------- */
function addWelcomeMessage(a){
  DB.messages.unshift({
    id:uid(), title:'Enrolment approved 🎉',
    body:'Welcome to ' + CONFIG.centre + '! ' + a.children.map(c => c.name + ' — student number ' + (c.studentNo||'')).join('\n') +
      '\n\nLog in any time with your student number to pay fees and read notices.',
    category:'general', audience:'student', target:a.children[0] ? a.children[0].id : null,
    important:true, at:new Date().toISOString(), author:'Front office'
  });
}
function approveApp(id){
  const a = DB.apps.find(x => x.id === id); if(!a) return;
  a.status = 'approved'; a.reviewedAt = new Date().toISOString(); a.reviewNote = '';
  saveDB();
  const issued = issueNumbers(a);
  ensureInvoices(a);
  addWelcomeMessage(a); saveDB();
  emailApproved(a);
  toast('Approved · ' + (issued.length ? 'student no. ' + issued.join(', ') : 'numbers already issued') + ' · email sent to ' + a.email, 'ok');
  render();
}
function rejectApp(id){
  const a = DB.apps.find(x => x.id === id); if(!a) return;
  const noteEl = document.querySelector(`[data-note="${id}"]`);
  a.status = 'rejected'; a.reviewedAt = new Date().toISOString(); a.reviewNote = noteEl ? noteEl.value.trim() : '';
  a.appeal = null; a.appealStatus = 'none';
  saveDB(); emailRejected(a, a.reviewNote);
  toast('Dismissed · email sent to ' + a.email + ' · parent may appeal once.', 'ok'); render();
}
function reinstateApp(id){
  const a = DB.apps.find(x => x.id === id); if(!a) return;
  a.status = 'approved'; a.reviewedAt = new Date().toISOString(); a.reviewNote = ''; a.appealStatus = 'accepted';
  saveDB();
  const issued = issueNumbers(a);
  ensureInvoices(a);
  addWelcomeMessage(a); saveDB();
  emailApproved(a);
  toast('Reinstated · ' + (issued.length ? 'student no. ' + issued.join(', ') : 'numbers issued') + ' · email sent.', 'ok');
  render();
}
function upholdApp(id){
  const a = DB.apps.find(x => x.id === id); if(!a) return;
  a.appealStatus = 'declined'; saveDB();
  sendEmail({
    to:a.email, subject:'Your appeal — final decision',
    body:'Hi ' + a.parentName + ',\n\nWe have carefully reviewed your appeal. Unfortunately the decision to dismiss your application stands, and this decision is final.\n\nYou are welcome to contact the office directly to discuss.\n\nKind regards,\n' + CONFIG.centre
  });
  toast('Dismissal upheld · email sent.','ok'); render();
}
function seedMsgs(){
  const now = Date.now();
  const add = (o) => DB.messages.push(Object.assign({ id:uid(), audience:'all', target:null, important:false, author:'Front office', at:new Date(now).toISOString() }, o));
  add({ title:'School trip to the Zoo 🦁', category:'trip', important:true, at:new Date(now - 3600e3).toISOString(),
        body:'Our Pre-School and Toddler groups are going to the Zoo on Friday. Please pack a hat, a water bottle and sunscreen. Permission slips are at the office. Bus leaves at 08:30 sharp.' });
  add({ title:'Menu change this week', category:'food', at:new Date(now - 26*3600e3).toISOString(),
        body:'Thursday lunch will be macaroni and cheese with a side salad instead of rice and mince. Fruit is still served at 15:00.' });
  add({ title:"Lerato's birthday party 🎂", category:'party', at:new Date(now - 50*3600e3).toISOString(),
        body:'We are celebrating a birthday this month! Cupcakes and juice will be provided by the centre. If your child has allergies, please let us know.' });
  add({ title:'Farewell for Teacher Anne 👋', category:'farewell', at:new Date(now - 80*3600e3).toISOString(),
        body:'After 9 wonderful years, Teacher Anne is moving on. Join us for a small farewell tea on the last Friday of the month at 15:30. Children may bring a card.' });
  saveDB(); toast('Sample announcements loaded.','ok'); render();
}
function seed(){
  const email = 'demo.parent@gmail.com';
  DB.users[email] = { email, name:'Nomsa Khumalo', picture:'', createdAt:new Date().toISOString() };
  DB.apps.push({
    id: uid(), email, parentName:'Nomsa Khumalo', phone:'072 445 1180', altPhone:'', relation:'Mother',
    address:{ line1:'18 Marula Street', suburb:'Extension 4', city:'Midrand', province:'Gauteng', postal:'1685' },
    children:[{ id:uid(), name:'Lerato Khumalo', dob:'2023-04-12', gender:'Girl', program:'toddler', medical:'Mild peanut allergy', studentNo:null }],
    emergency:{ name:'Sipho Khumalo', phone:'083 220 7710' },
    status:'pending', submittedAt:new Date().toISOString(), reviewedAt:null, reviewNote:''
  });
  saveDB(); toast('Sample application added.','ok'); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lightbearers-data-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Data exported.','ok');
}

document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* keep this tab in sync when index.html changes data in another tab */
window.addEventListener('storage', e => { if(e.key === KEY){ DB = loadDB(); render(); } });

render();
</script>
